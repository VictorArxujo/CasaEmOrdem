plugins {
    id "com.android.application"
}

android {
    namespace "br.com.casaemordem"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.casaemordem"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }
}

// Os fontes usam acentuação, então o javac precisa ler os arquivos como UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
